name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect
          path: |
            target/CoreProtect-*.jar
            !target/*-shaded.jar
          if-no-files-found: error
